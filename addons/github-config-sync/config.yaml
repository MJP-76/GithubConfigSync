name: "Github Config Sync"
description: "Home Assistant app for GitHub config sync operations, not backups. Private repositories are strongly recommended; public visibility is optional."
version: "1.6.8"
slug: "github_config_sync_web"
url: "https://github.com/MJP-76/GithubConfigSync"
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
hassio_api: true
panel_icon: mdi:github
panel_title: Github Config Sync
arch:
  - aarch64
  - amd64
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - all_addon_configs:rw
  - media:rw
  - share:rw
  - ssl
  - backup:rw
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Web UI (optional when using ingress)"
options:
  github_repository: ""
  github_branch: "main"
  github_token: ""
schema:
  auth_method: str?
  repo_mode: str?
  existing_repo_confirmed_for: str?
  github_repository: str?
  github_branch: str
  github_token: password?
  github_client_id: str?
  version_retention_count: int(1,100)?
  dry_run: bool?
  auto_sync_enabled: bool?
  auto_sync_days:
    - "int?"
  auto_sync_time: str?
  auto_sync_create_release: bool?
  include_addon_configs: bool?
  include_media: bool?
  include_share: bool?
  include_ssl: bool?
  include_backups: bool?
  include_www: bool?
  include_pre_releases: bool?
  sync_mode: list(whitelist|blacklist)?
