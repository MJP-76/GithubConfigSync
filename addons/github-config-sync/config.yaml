name: "Github Config Sync"
description: "Home Assistant app for GitHub config sync operations, not backups. Private repositories are strongly recommended; public visibility is optional."
version: "1.4.1"
slug: "github_config_sync_web"
url: "https://github.com/MJP-76/GithubConfigSync"
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:github
panel_title: Github Config Sync
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
map:
  - config:rw
  - addon_configs:rw
  - media:rw
  - share:rw
  - ssl
  - backups:rw
  - www:rw
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Web UI (optional when using ingress)"
options:
  github_repository: ""
  github_branch: "main"
  github_token: ""
schema:
  github_repository: str?
  github_branch: str
  github_token: password?
